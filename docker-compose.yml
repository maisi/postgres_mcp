version: "3.9"

services:
  postgres-readonly-mcp:
    image: maisi/postgres-mcp:latest
    container_name: postgres-readonly-mcp
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@192.168.0.8:5432/homeoffice-tracker}
      MCP_TRANSPORT: streamable-http
      FASTMCP_HOST: 0.0.0.0
      FASTMCP_PORT: 8000
    restart: unless-stopped
